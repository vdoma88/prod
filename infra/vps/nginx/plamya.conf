# /etc/nginx/sites-available/plamya — временный блок для plamya.belayarod.ru.
# Ставит infra/vps/13-plamya-cert.sh, чтобы заранее выпустить сертификат.
#
# Пока школа «Язык Пламени» живёт на belayarod.ru, новый адрес просто ведёт
# туда. В день переезда (infra/MIGRATION.md) этот файл удаляется, а
# server_name plamya.belayarod.ru получает конфиг самой школы.
server {
    listen 80;
    listen [::]:80;
    server_name plamya.belayarod.ru;

    location / {
        return 302 https://belayarod.ru$request_uri;
    }
}
