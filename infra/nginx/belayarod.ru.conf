# belayarod.ru — общий сайт «Сила Рода» (лендинг + /brand/).
#
# Файл: /etc/nginx/sites-available/belayarod.ru, ссылка в sites-enabled.
# Сертификаты выпускает certbot (см. infra/DEPLOY.md); пути ниже — его стандартные.
# Заголовки безопасности — infra/nginx/snippets/sila-roda-headers.conf
# (копируется в /etc/nginx/snippets/).
#
# Чужие домены, направленные на IP сервера, получают 444 (строки с пометкой
# reject-foreign-domains.sh — тот же формат, что у скрипта школы, и он их узнаёт).
#
# Учебные приложения живут на своих поддоменах со своими конфигами
# из собственных репозиториев (см. infra/DOMAINS.md). Этот файл их не касается,
# кроме блока «Переезд школы» ниже.

server {
    listen 80;
    listen [::]:80;
    server_name belayarod.ru www.belayarod.ru;
    # чужие имена → 444, deploy/reject-foreign-domains.sh
    if ($host !~* "^(belayarod\.ru|www\.belayarod\.ru)$") { return 444; }
    return 301 https://belayarod.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.belayarod.ru;
    # чужие имена → 444, deploy/reject-foreign-domains.sh
    if ($host !~* "^(www\.belayarod\.ru)$") { return 444; }
    ssl_certificate     /etc/letsencrypt/live/belayarod.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belayarod.ru/privkey.pem;
    return 301 https://belayarod.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name belayarod.ru;
    # чужие имена → 444, deploy/reject-foreign-domains.sh
    if ($host !~* "^(belayarod\.ru)$") { return 444; }

    ssl_certificate     /etc/letsencrypt/live/belayarod.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/belayarod.ru/privkey.pem;

    root /var/www/prod/dist;
    index index.html;
    charset utf-8;

    include /etc/nginx/snippets/sila-roda-headers.conf;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json application/xml;

    # Сторонние сервисы, которые до переезда жили на belayarod.ru в конфиге
    # школы (например, вебхук бота /tg/ekaterina-bot/ → 127.0.0.1:8081).
    # Скрипт переезда flame-app/deploy/move-to-plamya.sh кладёт их сюда без
    # изменений, чтобы их адреса не поменялись. Пустая папка — не ошибка.
    include /etc/nginx/snippets/belayarod-extra/*.conf;

    # Telegram-бот лендинга (bot/, служба rodbot, порт 4310). Наружу — только
    # вебхук; /tg/rod-bot/health остаётся внутренним.
    location = /tg/rod-bot {
        proxy_pass http://127.0.0.1:4310;
        proxy_set_header Host $host;
        client_max_body_size 1m;
    }

    # Общий вход для курсов (accounts/, служба sr-accounts, порт 4320).
    # /account/internal/ — только для курсов на этом сервере, снаружи закрыт.
    location = /account { return 301 /account/; }
    location ^~ /account/internal/ { return 404; }
    location ^~ /account/ {
        proxy_pass http://127.0.0.1:4320;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 64k;
    }

    # --- Переезд школы «Язык Пламени» на plamya.belayarod.ru -----------------
    # До объединения школа жила в корне belayarod.ru. Всё, что принадлежит ей,
    # отправляем на новый адрес с тем же путём: API (включая вебхук Telegram,
    # пока его не перерегистрировали), загруженные фото, сборку Next.js,
    # кабинет /console и иконки установленного на телефон приложения.
    # 308 сохраняет метод и тело запроса (POST остаётся POST).
    location ^~ /api/      { return 308 https://plamya.belayarod.ru$request_uri; }
    location ^~ /uploads/  { return 308 https://plamya.belayarod.ru$request_uri; }
    location ^~ /_next/    { return 308 https://plamya.belayarod.ru$request_uri; }
    location = /console    { return 308 https://plamya.belayarod.ru$request_uri; }
    location = /manifest.json { return 308 https://plamya.belayarod.ru$request_uri; }
    location ~ ^/(icon-\d+\.png|apple-touch-icon\.png|favicon-32\.png)$ {
        return 308 https://plamya.belayarod.ru$request_uri;
    }
    # -------------------------------------------------------------------------

    # Общий бренд: имена файлов без версии, поэтому кэш короткий.
    location ^~ /brand/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        include /etc/nginx/snippets/sila-roda-headers.conf;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/sila-roda-headers.conf;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/sila-roda-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
