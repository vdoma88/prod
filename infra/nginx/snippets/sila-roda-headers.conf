# Заголовки безопасности belayarod.ru. Подключается include-ом на уровне
# server и в каждом location, где есть свой add_header: nginx не наследует
# add_header сервера в location, у которого есть собственные.
#
# Строку CSP читает scripts/serve.mjs, чтобы локальная проверка шла с той же
# политикой, что на сервере. Менять — только здесь.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
