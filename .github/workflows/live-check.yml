name: Live site freshness
run-name: Live ${{ inputs.expected_sha || github.sha }} (${{ github.event_name }})

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Полный SHA уже опубликованной сборки
        required: true
        type: string

permissions:
  contents: read

# Push новой, ещё не опубликованной версии не отменяет post-deploy аудит.
concurrency:
  group: live-audit-production-${{ github.event_name == 'push' && 'push' || 'post-deploy' }}
  cancel-in-progress: true

jobs:
  verify-live:
    # Отключать резервный push только после проверки callback на VPS (infra/DEPLOY.md).
    if: github.event_name != 'push' || vars.LIVE_AUDIT_MODE != 'post-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      expected_sha: ${{ steps.version.outputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить опубликованный commit
        id: version
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
          LIVE_ATTEMPTS: ${{ github.event_name == 'push' && '16' || '6' }}
          LIVE_REPORT_PATH: live-check/report.json
        run: node scripts/check-live.mjs
      - name: Сохранить диагностику публикации
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belayarod-live-freshness
          path: live-check/
          retention-days: 7

  iphone-audit:
    needs: verify-live
    uses: ./.github/workflows/iphone-safari-audit.yml
    with:
      expected_sha: ${{ needs.verify-live.outputs.expected_sha }}
