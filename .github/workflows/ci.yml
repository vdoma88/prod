name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сборка и проверки
        run: npm test
      - name: Скрипты VPS (shellcheck)
        run: shellcheck -x -S warning infra/vps/*.sh
      - name: Браузер
        run: |
          npm i -g playwright@1.56.1
          npx playwright install --with-deps chromium
          PLAYWRIGHT_MODULE="$(npm root -g)/playwright/index.mjs" npm run test:e2e
