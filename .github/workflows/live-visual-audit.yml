name: Live visual audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить Chromium
        run: |
          npm i -g playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Снять live-страницы
        env:
          PLAYWRIGHT_MODULE: /opt/hostedtoolcache/node/22.23.2/x64/lib/node_modules/playwright/index.mjs
        run: |
          export PLAYWRIGHT_MODULE="$(npm root -g)/playwright/index.mjs"
          cat > /tmp/live-audit.mjs <<'EOF'
          import { writeFile, mkdir } from 'node:fs/promises';
          const { chromium } = await import(process.env.PLAYWRIGHT_MODULE);

          const base = 'https://belayarod.ru';
          const pages = [
            ['home','/'],
            ['therapy','/therapy.html'],
            ['mystery','/mystery.html'],
            ['game','/game.html'],
            ['offerings','/offerings.html'],
            ['candles','/candle-course.html'],
            ['tarot','/tarot-course.html'],
            ['runes','/runes.html'],
            ['massage','/massage.html'],
            ['consultations','/consultations.html'],
            ['courses','/courses.html'],
          ];
          const viewports = [
            ['desktop', { width: 1440, height: 900 }],
            ['mobile', { width: 390, height: 844 }],
          ];

          await mkdir('live-audit', { recursive: true });
          const browser = await chromium.launch();
          const report = [];

          for (const [vpName, viewport] of viewports) {
            const context = await browser.newContext({ viewport, deviceScaleFactor: 1 });
            for (const [name, path] of pages) {
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', e => errors.push('pageerror: ' + e.message));
              page.on('console', m => {
                if (m.type() === 'error' && !/Failed to load resource|ERR_FAILED/.test(m.text())) errors.push('console: ' + m.text());
              });

              const url = base + path + (path.includes('?') ? '&' : '?') + 'audit=' + Date.now();
              let status = 0;
              try {
                const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 });
                status = response?.status() || 0;
              } catch (e) {
                errors.push('goto: ' + e.message);
              }
              await page.waitForTimeout(600);

              const metrics = await page.evaluate(() => {
                const brokenImages = [...document.images].filter(img => !img.complete || img.naturalWidth === 0).map(img => img.src);
                const overflow = document.documentElement.scrollWidth - document.documentElement.clientWidth;
                const h1 = [...document.querySelectorAll('h1')].map(x => x.textContent.trim());
                const visibleButtons = [...document.querySelectorAll('a,button')].filter(el => {
                  const r = el.getBoundingClientRect();
                  const cs = getComputedStyle(el);
                  return r.width > 0 && r.height > 0 && cs.visibility !== 'hidden' && cs.display !== 'none';
                }).length;
                return {
                  title: document.title,
                  overflow,
                  brokenImages,
                  h1,
                  bodyWidth: document.body.scrollWidth,
                  viewportWidth: innerWidth,
                  visibleButtons,
                  hasMonogram: !!document.querySelector('.brand-monogram'),
                  hasDS2Home: document.body.innerText.includes('Четыре маршрута для практики'),
                };
              });

              const shot = `live-audit/${vpName}-${name}.png`;
              await page.screenshot({ path: shot, fullPage: true });
              report.push({ viewport: vpName, page: name, path, status, errors, ...metrics, screenshot: shot });
              console.log(JSON.stringify(report.at(-1)));
              await page.close();
            }
            await context.close();
          }

          await browser.close();
          await writeFile('live-audit/report.json', JSON.stringify(report, null, 2));
          EOF
          node /tmp/live-audit.mjs

      - name: Загрузить аудит
        uses: actions/upload-artifact@v4
        with:
          name: belayarod-live-visual-audit
          path: live-audit/
          retention-days: 7
